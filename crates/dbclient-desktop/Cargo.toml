[package]
name = "dbclient-desktop"
description = "Database client desktop app (Tauri, Rust side). Frontend lives in ./ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "dbclient-desktop"

[lib]
name = "dbclient_desktop"
path = "src/lib.rs"

[[bin]]
name = "dbclient-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
