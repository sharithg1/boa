name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The Release workflow runs CI on the release commit before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt + version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml and tauri.conf.json versions agree
        run: scripts/check-version.sh
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  # The Tauri desktop crate is the whole workspace and only ships for macOS
  # (Tauri on Linux would need webkit2gtk). The Postgres integration tests
  # skip themselves without PGHOST.
  rust-macos:
    name: clippy + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        id: test
        run: cargo nextest run --profile ci --workspace --all-features --locked
      - name: doctests
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: cargo test --doc --workspace --all-features --locked

  ui:
    name: desktop UI (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/dbclient-desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/dbclient-desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
