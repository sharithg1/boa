name: Release build

# Builds Boa.app (GPUI) for both architectures and as a universal bundle,
# with ad-hoc signatures, and keeps the results as workflow artifacts.
# MANUAL ONLY (Actions -> Release build -> Run workflow): nothing here signs
# with a Developer ID, notarizes, signs update bundles or publishes a release.
# Those steps need the repository secrets listed in docs/RELEASING.md and are
# added when the user decides to ship ("The bridge release" there).

on:
  workflow_dispatch:
    inputs:
      dmg:
        description: Also build DMGs
        type: boolean
        default: true

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Boa supports macOS 11+ (LSMinimumSystemVersion); bundle.sh sets it too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(scripts/check-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Boa $version (unsigned build, not published)" >> "$GITHUB_STEP_SUMMARY"

  # One job per architecture, both on Apple silicon (the Intel build is a
  # cross-compile; Intel macOS runners are being retired).
  app:
    name: Boa.app (${{ matrix.arch }})
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml) + target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Cargo.lock is up to date
        run: cargo fetch --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - name: no rehearsal key in a release build
        run: |
          if [ -n "${BOA_UPDATER_PUBKEY:-}" ]; then
            echo "::error::BOA_UPDATER_PUBKEY is set; release builds must trust the production updater key"
            exit 1
          fi
      - name: scripts/bundle.sh
        env:
          ARCH: ${{ matrix.arch }}
          DMG: ${{ inputs.dmg }}
          BOA_BUILD_COMMIT: ${{ github.sha }}
        run: |
          args=(--arch "$ARCH" --out out)
          if [ "$DMG" = true ]; then args+=(--dmg); fi
          scripts/bundle.sh "${args[@]}"
          # The binary, for the universal job.
          mkdir -p bin && cp "target/${{ matrix.target }}/release/boa-app" bin/boa-app
      - name: check the bundle
        run: |
          app=out/Boa.app
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$v" = "${{ needs.version.outputs.version }}" ] || { echo "::error::Info.plist version $v"; exit 1; }
          codesign --verify --strict --verbose=2 "$app"
          lipo -info "$app/Contents/MacOS/boa-desktop"
          rm -rf "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin/boa-app
          if-no-files-found: error

  universal:
    name: Boa.app (universal)
    needs: [version, app]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release
      - name: scripts/bundle.sh --arch universal --no-build
        env:
          DMG: ${{ inputs.dmg }}
        run: |
          chmod +x target/*/release/boa-app
          args=(--arch universal --no-build --out out)
          if [ "$DMG" = true ]; then args+=(--dmg); fi
          scripts/bundle.sh "${args[@]}"
          lipo -verify_arch arm64 x86_64 out/Boa.app/Contents/MacOS/boa-desktop
          codesign --verify --strict --verbose=2 out/Boa.app
          rm -rf out/Boa.app
      - uses: actions/upload-artifact@v4
        with:
          name: app-universal
          path: out/*
          if-no-files-found: error
