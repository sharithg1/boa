[package]
name = "boa-core"
description = "Boa's backend without UI: Postgres sessions, introspection, export, saved connections, history, SSH tunnels, and the async bridge (Backend) the GPUI app awaits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
futures-util = "0.3.34"
futures-channel = "0.3.34"
async-channel = "2.5.0"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "rt-multi-thread", "process", "net", "io-util"] }
# Ordered maps for state/session.rs (JS object key order matters there).
indexmap = { version = "2.14.2", features = ["serde"] }
# Reads the old WebKit localStorage once (state/local_storage.rs). SQLite is public domain.
rusqlite = { version = "0.40", features = ["bundled"] }
# Redis connections (redis.rs). BSD-3-Clause.
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "tokio-native-tls-comp"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
futures-executor = "0.3.34"

[lints]
workspace = true
