# The Tauri app's updater, standalone, for scripts/rehearse-bridge.sh. Not part
# of the Boa workspace (own [workspace]); the versions are the Tauri app's
# (Cargo.lock copied from it), so this is the code installed Tauri builds run.
[package]
name = "bridge-rehearsal"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tauri = { version = "=2.12.4", default-features = false, features = ["test"] }
tauri-plugin-updater = "=2.14.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
